name: Ustam native packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.gitattributes', 'ustam/**', 'launchers/**', 'scripts/build_ustam*', 'tests/test_ustam*', '.github/workflows/ustam-app.yml']
  pull_request:
    paths: ['.gitattributes', 'ustam/**', 'launchers/**', 'scripts/build_ustam*', 'tests/test_ustam*', '.github/workflows/ustam-app.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.22.3
      - name: Validate source and immutable engines
        run: python scripts/validate.py
      - name: Run source tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate and verify four local immutable engine closures
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/build_ustam_engines.py
          git diff --exit-code -- ustam/engines ustam/engine-manifest.json
          python -c "from scripts.build_ustam_app import verify_assets; verify_assets()"
      - name: Build native package from checked-in immutable engine closure
        run: python scripts/build_ustam_app.py --skip-engine-build
      - name: Test bundled runtime offline
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, unittest
          # Select the package directory rather than its ZIP/metadata siblings.
          package = next(p for p in pathlib.Path('dist').glob('ustam-*-*') if p.is_dir())
          worker = next(p for p in package.rglob('UstamWorker*') if p.is_file() and p.name in ('UstamWorker', 'UstamWorker.exe'))
          os.environ['USTAM_FROZEN_WORKER'] = str(worker.resolve())
          launcher_name = 'Ustam.exe' if os.name == 'nt' else 'Ustam'
          launcher = next(p for p in package.rglob(launcher_name) if p.is_file())
          os.environ['USTAM_NATIVE_LAUNCHER'] = str(launcher.resolve())
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests', pattern='test_ustam_packaging.py'))
          raise SystemExit(not result.wasSuccessful())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ustam-${{ matrix.os }}
          path: |
            dist/ustam-*.zip
            dist/ustam-*.json
          if-no-files-found: error
